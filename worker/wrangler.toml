name = "blfm-sms-consent"
main = "src/index.js"
compatibility_date = "2026-07-16"

# ── D1 database ────────────────────────────────────────────────
# Create with: wrangler d1 create blfm_sms_consent
# Then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "blfm_sms_consent"
database_id = "e75f9104-426b-4aaa-bdc7-40d36672ad2a"

# ── Public, non-secret config ────────────────────────────────────
[vars]
ALLOWED_ORIGINS = "https://buffetluciasfiestamexicana.com,https://www.buffetluciasfiestamexicana.com"

# BLFM "SMS Notifications and Specials" program (order texts + specials,
# two separate opt-in checkboxes, one consent_records row per box checked)
PRIVACY_URL = "https://buffetluciasfiestamexicana.com/privacy/"
TERMS_URL = "https://buffetluciasfiestamexicana.com/terms/"
CONSENT_PAGE_URL = "https://buffetluciasfiestamexicana.com/sms-consent/"
POLICY_VERSION = "2026-11-02"

# "Julio Salas SMS Testing" program — personal sole-proprietor brand,
# entirely separate from BLFM's registered brand/campaign.
JULIO_PRIVACY_URL = "https://buffetluciasfiestamexicana.com/julio-sms-privacy/"
JULIO_TERMS_URL = "https://buffetluciasfiestamexicana.com/julio-sms-terms/"
JULIO_CONSENT_PAGE_URL = "https://buffetluciasfiestamexicana.com/julio-sms-consent/"
JULIO_POLICY_VERSION = "2026-07-21"

SEND_OPT_IN_CONFIRMATION = "true"

# ── Secrets (never put these here — set with `wrangler secret put`) ──
#   BLFM_TWILIO_ACCOUNT_SID               (BLFM's own Twilio account)
#   BLFM_TWILIO_AUTH_TOKEN                (BLFM's own Twilio account)
#   TWILIO_MESSAGING_SERVICE_SID          (BLFM's registered Messaging Service,
#                                          in BLFM's own Twilio account. If
#                                          any of these three BLFM secrets is
#                                          unset, consent still records but no
#                                          confirmation SMS is sent.)
#   SHEETDB_ID, SHEETDB_USER, SHEETDB_PASS (the POS orders sheet's SheetDB
#                                          API; each BLFM sign-up is copied
#                                          to its "SMSSignups" tab)
#   SIGNUP_SIGNING_KEY                    (signs each sheet row; the same
#                                          value is set in the POS's Vercel
#                                          env so its broadcast only texts
#                                          rows the form wrote. If this or
#                                          SHEETDB_ID is unset, nothing is
#                                          copied to the sheet.)
#   TWILIO_ACCOUNT_SID                    (shared Twilio account — used only
#                                          by the Julio Salas program)
#   TWILIO_AUTH_TOKEN                     (shared Twilio account — used only
#                                          by the Julio Salas program; also
#                                          the salt for IP hashing)
#   JULIO_TWILIO_MESSAGING_SERVICE_SID    (Julio Salas's registered Messaging
#                                          Service — leave unset until that
#                                          campaign is approved; the Worker
#                                          just won't send a confirmation SMS
#                                          for this program until it's set,
#                                          but consent still records fine)

# ── Deployment URL ────────────────────────────────────────────────
# No [[routes]]/custom domain configured — this deploys to the free
# *.workers.dev URL Cloudflare assigns automatically, e.g.:
#   https://blfm-sms-consent.<your-account-subdomain>.workers.dev/sms-consent
# That requires no DNS changes at all. CORS (ALLOWED_ORIGINS above)
# still restricts who can call it. If you later move this domain's
# DNS to Cloudflare, you can add a [[routes]] block here to serve it
# from api.buffetluciasfiestamexicana.com instead.
